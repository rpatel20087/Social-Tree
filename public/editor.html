<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialtree — Editor</title>
<link rel="stylesheet" href="style.css">
<style>
body { display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--surface); }

/* ── EDITOR NAV ── */
.e-nav {
  display:flex;align-items:center;justify-content:space-between;
  padding:.65rem 1.35rem;background:var(--white);border-bottom:1px solid var(--border-l);
  flex-shrink:0;gap:.75rem;flex-wrap:wrap;
}
.e-nav-l { display:flex;align-items:center;gap:.65rem; }
.back-btn {
  display:inline-flex;align-items:center;gap:.35rem;
  color:var(--muted);font-size:.8rem;background:none;border:none;
  font-family:'Inter',sans-serif;cursor:pointer;padding:.35rem .55rem;
  border-radius:6px;transition:all .18s;
}
.back-btn svg { width:14px;height:14px; }
.back-btn:hover { background:var(--border-l);color:var(--ink); }
.page-pill { font-size:.82rem;font-weight:600;color:var(--ink); }
.e-nav-r { display:flex;align-items:center;gap:.45rem; }
.save-status { font-size:.72rem;color:var(--muted);transition:color .28s; }
.save-status.saving { color:var(--rose); }
.save-status.saved  { color:#1a6e3c; }

/* ── LAYOUT ── */
.e-body { display:flex;flex:1;overflow:hidden; }

/* ── PANEL ── */
.e-panel {
  width:420px;flex-shrink:0;background:var(--white);
  border-right:1px solid var(--border-l);overflow-y:auto;
  display:flex;flex-direction:column;
}
.e-section { padding:1.1rem 1.35rem;border-bottom:1px solid var(--border-l); }
.e-section:last-of-type { border-bottom:none;flex:1; }
.e-section-title { font-size:.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.85rem; }

/* Avatar */
.av-row { display:flex;align-items:center;gap:.85rem;margin-bottom:.95rem; }
.av-btn {
  width:54px;height:54px;border-radius:12px;
  background:var(--rose-l);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--rose-d);cursor:pointer;overflow:hidden;transition:opacity .18s;flex-shrink:0;
}
.av-btn:hover { opacity:.8; }
.av-btn img { width:100%;height:100%;object-fit:cover; }
.av-btn svg { width:22px;height:22px; }
.av-info p { font-size:.82rem;font-weight:500;margin-bottom:2px; }
.av-info span { font-size:.71rem;color:var(--muted); }

/* Slug prefix */
.slug-wrap { display:flex;align-items:center; }
.slug-pre-sm { padding:.62rem .7rem;background:var(--surface);border:1.5px solid var(--border);border-right:none;border-radius:var(--radius-sm) 0 0 var(--radius-sm);font-size:.73rem;color:var(--muted);white-space:nowrap; }
.slug-wrap input { border-radius:0 var(--radius-sm) var(--radius-sm) 0; }

/* Theme dots */
.theme-dots { display:flex;gap:.45rem;flex-wrap:wrap; }
.tdot {
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .15s,border-color .15s;
  position:relative;flex-shrink:0;
}
.tdot:hover { transform:scale(1.12); }
.tdot.on { border-color:var(--ink); }
.tdot::after { content:''; position:absolute;inset:3px;border-radius:50%;background:rgba(0,0,0,.18);opacity:0;transition:opacity .15s; }
.tdot.on::after { opacity:1; }

/* Links */
.links-list { display:flex;flex-direction:column;gap:.42rem; }
.link-row {
  background:var(--card-bg);border:1px solid var(--border-l);border-radius:9px;
  padding:.62rem .72rem;display:flex;align-items:center;gap:.55rem;
  transition:box-shadow .15s;
}
.link-row:hover { box-shadow:var(--shadow-xs); }
.link-row.dragging { opacity:.38; }
.drag-grip { color:var(--border);cursor:grab;user-select:none;flex-shrink:0;display:flex;align-items:center; }
.drag-grip svg { width:14px;height:14px; }
.link-icon-wrap { position:relative;flex-shrink:0; }
.link-icon-btn {
  width:30px;height:30px;border-radius:7px;background:var(--white);
  border:1.5px solid var(--border-l);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .18s;padding:0;
}
.link-icon-btn:hover { background:var(--rose-l); }
.link-icon-btn svg { width:14px;height:14px; }
.link-inputs { flex:1;display:flex;flex-direction:column;gap:.27rem; }
.link-inputs input {
  width:100%;padding:.32rem .52rem;border:1.5px solid var(--border-l);
  border-radius:5px;font-family:'Inter',sans-serif;font-size:.78rem;
  outline:none;background:var(--white);transition:border-color .18s;
}
.link-inputs input:focus { border-color:var(--rose); }
.link-inputs input::placeholder { color:var(--faint); }
.link-del {
  background:none;border:none;cursor:pointer;
  color:var(--faint);display:flex;align-items:center;
  flex-shrink:0;transition:color .18s;padding:3px;border-radius:5px;
}
.link-del svg { width:13px;height:13px; }
.link-del:hover { color:#c0392b;background:#fff0ee; }
.add-link-btn {
  width:100%;padding:.55rem;background:transparent;
  border:1.5px dashed var(--border);border-radius:8px;
  cursor:pointer;font-family:'Inter',sans-serif;font-size:.79rem;
  color:var(--muted);transition:all .18s;
  display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:.42rem;
}
.add-link-btn svg { width:14px;height:14px; }
.add-link-btn:hover { border-color:var(--rose);color:var(--rose);background:rgba(212,117,106,.03); }

/* Icon picker */
.icon-popup {
  position:absolute;background:var(--white);border:1px solid var(--border);
  border-radius:12px;padding:.6rem;z-index:300;
  box-shadow:var(--shadow-lg);top:calc(100% + 5px);left:0;width:258px;
}
.icon-popup-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:3px; }
.i-opt {
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 3px;border-radius:7px;cursor:pointer;
  transition:background .15s;border:1.5px solid transparent;
}
.i-opt:hover { background:var(--surface); }
.i-opt.sel { border-color:var(--rose);background:var(--rose-l); }
.i-opt svg { width:16px;height:16px; }
.i-opt-lbl { font-size:.5rem;color:var(--muted);text-align:center;line-height:1.2; }

/* Publish footer */
.pub-footer { padding:1rem 1.35rem;border-top:1px solid var(--border-l);background:var(--white);flex-shrink:0; }
.live-row {
  display:flex;align-items:center;gap:.5rem;
  background:var(--mint);border-radius:7px;
  padding:.45rem .75rem;margin-bottom:.65rem;font-size:.76rem;
}
.live-dot { width:7px;height:7px;border-radius:50%;background:#27ae60;flex-shrink:0; }
.live-row a { color:#1a6e3c;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

/* ── PREVIEW ── */
.preview-pane {
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:2.25rem 1.5rem;overflow-y:auto;
  background: repeating-linear-gradient(
    45deg,transparent,transparent 28px,rgba(0,0,0,.015) 28px,rgba(0,0,0,.015) 29px
  );
}
.preview-label { font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1.1rem; }

.phone {
  width:292px;background:var(--white);border-radius:32px;
  box-shadow:0 8px 40px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.05);
  overflow:hidden;min-height:530px;flex-shrink:0;
}
.phone-screen {
  padding:1.65rem 1.2rem 2.1rem;min-height:530px;
  display:flex;flex-direction:column;align-items:center;transition:background .38s;
}

/* Phone theme backgrounds */
.t-blush    .phone-screen { background:linear-gradient(135deg,#fff5f2,#fce8e0); }
.t-mint     .phone-screen { background:linear-gradient(135deg,#f2fbf5,#d9f0e2); }
.t-lavender .phone-screen { background:linear-gradient(135deg,#f5f2ff,#e6dffa); }
.t-butter   .phone-screen { background:linear-gradient(135deg,#fffbf0,#f8edcc); }
.t-sky      .phone-screen { background:linear-gradient(135deg,#f0f8ff,#d0e8f8); }
.t-white    .phone-screen { background:#ffffff; }
.t-blush    .pv-link { background:rgba(244,217,208,.52); }
.t-mint     .pv-link { background:rgba(208,232,216,.52); }
.t-lavender .pv-link { background:rgba(221,212,240,.52); }
.t-butter   .pv-link { background:rgba(245,237,204,.52); }
.t-sky      .pv-link { background:rgba(204,228,240,.52); }
.t-white    .pv-link { background:#f0ece8; }

/* Preview elements */
.pv-av {
  width:66px;height:66px;border-radius:50%;margin-bottom:.75rem;
  display:flex;align-items:center;justify-content:center;font-size:1.7rem;
  border:2.5px solid rgba(255,255,255,.85);box-shadow:0 2px 10px rgba(0,0,0,.09);
  overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.6);
}
.pv-av img { width:100%;height:100%;object-fit:cover; }
.pv-av svg { width:26px;height:26px;color:rgba(0,0,0,.3); }
.pv-name { font-family:'Instrument Serif',serif;font-size:1.1rem;margin-bottom:.22rem;text-align:center; }
.pv-bio  { font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5;margin-bottom:1.1rem;max-width:210px; }
.pv-links { width:100%;display:flex;flex-direction:column;gap:.42rem; }
.pv-link { display:flex;align-items:center;gap:.5rem;padding:.6rem .82rem;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.76rem;font-weight:500;transition:transform .15s; }
.pv-link:hover { transform:translateY(-1px); }
.pv-link svg { width:14px;height:14px;flex-shrink:0; }
.pv-footer { margin-top:1.6rem;font-size:.58rem;color:var(--muted);opacity:.4; }

@media(max-width:760px){
  .e-body{flex-direction:column}
  .e-panel{width:100%;flex:none;max-height:52vh}
  .preview-pane{display:none}
}
</style>
</head>
<body>

<!-- EDITOR NAV -->
<header class="e-nav">
  <div class="e-nav-l">
    <button class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Dashboard
    </button>
    <div class="page-pill" id="pagePill">Loading…</div>
  </div>
  <div class="e-nav-r">
    <span class="save-status" id="saveStatus">All saved</span>
    <button class="btn btn-outline btn-sm" onclick="downloadHTML()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
    <button class="btn btn-rose btn-sm" id="pubBtnTop" onclick="publishPage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
      Publish
    </button>
  </div>
</header>

<div class="e-body">
  <!-- PANEL -->
  <aside class="e-panel">

    <!-- PROFILE -->
    <div class="e-section">
      <div class="e-section-title">Profile</div>
      <div class="av-row">
        <div class="av-btn" id="avBtn" onclick="$('avInput').click()" title="Upload photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="av-info">
          <p>Profile photo</p>
          <span>Click to upload</span>
        </div>
      </div>
      <input type="file" id="avInput" accept="image/*" style="display:none" onchange="handleAvatar(this)">
      <div class="field" style="margin-bottom:.7rem">
        <label>Display name</label>
        <input type="text" id="fName" placeholder="Your name" oninput="queueSave()">
      </div>
      <div class="field" style="margin-bottom:.7rem">
        <label>URL slug</label>
        <div class="slug-wrap">
          <span class="slug-pre-sm">…vercel.app/u/</span>
          <input type="text" id="fSlug" placeholder="yourname" oninput="sanitizeSlug();queueSave()" style="border-radius:0 var(--radius-sm) var(--radius-sm) 0">
        </div>
        <div class="hint">social-tree-self.vercel.app/u/<strong id="slugShow" style="color:var(--rose)">yourname</strong></div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>Bio</label>
        <textarea id="fBio" placeholder="A short line about you…" rows="2" oninput="queueSave()"></textarea>
      </div>
    </div>

    <!-- THEME -->
    <div class="e-section">
      <div class="e-section-title">Theme</div>
      <div class="theme-dots">
        <div class="tdot on" data-t="blush"    style="background:linear-gradient(135deg,#f9d5c8,#f0a0a0)" onclick="setTheme('blush',this)"   title="Blush"></div>
        <div class="tdot"    data-t="mint"     style="background:linear-gradient(135deg,#c8ecd4,#90c8a0)" onclick="setTheme('mint',this)"    title="Mint"></div>
        <div class="tdot"    data-t="lavender" style="background:linear-gradient(135deg,#ddd4f0,#b8a0d8)" onclick="setTheme('lavender',this)" title="Lavender"></div>
        <div class="tdot"    data-t="butter"   style="background:linear-gradient(135deg,#f8edcc,#e8c87a)" onclick="setTheme('butter',this)"   title="Butter"></div>
        <div class="tdot"    data-t="sky"      style="background:linear-gradient(135deg,#cce4f0,#80b8d8)" onclick="setTheme('sky',this)"      title="Sky"></div>
        <div class="tdot"    data-t="white"    style="background:#fff;border:1.5px solid #ddd"            onclick="setTheme('white',this)"    title="White"></div>
      </div>
    </div>

    <!-- LINKS -->
    <div class="e-section" style="flex:1">
      <div class="e-section-title">Links</div>
      <div class="links-list" id="linksList"></div>
      <button class="add-link-btn" onclick="addLink()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add link
      </button>
    </div>

    <!-- PUBLISH -->
    <div class="pub-footer">
      <div class="live-row hidden" id="liveRow">
        <div class="live-dot"></div>
        <span style="color:#1a6e3c;font-size:.73rem;flex-shrink:0">Live at</span>
        <a id="liveLink" href="#" target="_blank"></a>
      </div>
      <button class="btn btn-rose btn-block" id="pubBtnBottom" onclick="publishPage()" style="border-radius:8px;padding:.72rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
        Publish to Socialtree
      </button>
    </div>

  </aside>

  <!-- PREVIEW -->
  <section class="preview-pane">
    <div class="preview-label">Live Preview</div>
    <div class="phone t-blush" id="phone">
      <div class="phone-screen">
        <div class="pv-av" id="pvAv">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="pv-name"  id="pvName">Your Name</div>
        <div class="pv-bio"   id="pvBio"></div>
        <div class="pv-links" id="pvLinks"></div>
        <div class="pv-footer">made with Socialtree</div>
      </div>
    </div>
  </section>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="shared.js"></script>
<script>
const pageId = new URLSearchParams(location.search).get('id');
if (!pageId) window.location.href='dashboard.html';

let page=null, currentUser=null, saveTimer=null, activePicker=null;

Auth.onStateChange(async user => {
  if (!user) { window.location.href='login.html'; return; }
  currentUser=user; await loadPage();
});

async function loadPage() {
  page=await DB.getPage(pageId);
  if(!page||page.userId!==currentUser.uid){ window.location.href='dashboard.html'; return; }
  $('pagePill').textContent=page.name||'Untitled';
  $('fName').value=page.name||''; $('fSlug').value=page.slug||''; $('fBio').value=page.bio||'';
  $('slugShow').textContent=page.slug||'yourname';
  if(page.avatarDataUrl){
    $('avBtn').innerHTML=`<img src="${page.avatarDataUrl}" alt="" style="width:100%;height:100%;object-fit:cover">`;
  }
  document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('on',d.dataset.t===page.theme));
  $('phone').className='phone t-'+(page.theme||'blush');
  if(page.isPublished&&page.slug) showLiveUrl(`social-tree-self.vercel.app/u/${page.slug}`);
  (page.links||[]).forEach(l=>renderLink(l));
  updatePreview();
}

// AVATAR
function handleAvatar(input) {
  const file=input.files[0]; if(!file) return;
  const img=new Image(), reader=new FileReader();
  reader.onload=ev=>{
    img.onload=()=>{
      const MAX=200, scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=img.width*scale; c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',.82);
      page.avatarDataUrl=dataUrl; page.avatarEmoji=null;
      $('avBtn').innerHTML=`<img src="${dataUrl}" alt="" style="width:100%;height:100%;object-fit:cover">`;
      updatePreview(); queueSave();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// THEME
function setTheme(name,el) {
  page.theme=name;
  document.querySelectorAll('.tdot').forEach(d=>d.classList.remove('on'));
  el.classList.add('on'); $('phone').className='phone t-'+name; queueSave();
}

// SLUG
function sanitizeSlug() {
  $('fSlug').value=slugify($('fSlug').value);
  $('slugShow').textContent=$('fSlug').value||'yourname';
}

// LINKS
function addLink(preset=null) {
  const id=genId();
  const link={id,iconId:preset?.iconId||'link',label:preset?.label||'New Link',url:''};
  if(!page.links) page.links=[];
  page.links.push(link); renderLink(link); updatePreview(); queueSave();
}

function renderLink(link) {
  const list=$('linksList');
  const ic=ICONS[link.iconId]||ICONS.link;
  const div=document.createElement('div');
  div.className='link-row'; div.dataset.id=link.id; div.draggable=true;
  div.innerHTML=`
    <div class="drag-grip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="18" r="1" fill="currentColor"/><circle cx="15" cy="6" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="18" r="1" fill="currentColor"/></svg>
    </div>
    <div class="link-icon-wrap">
      <button class="link-icon-btn" onclick="openIconPicker('${link.id}',this)" style="color:${ic.color}" title="Change icon">
        ${svgWith(link.iconId,14,ic.color)}
      </button>
    </div>
    <div class="link-inputs">
      <input type="text" placeholder="Label" value="${escHtml(link.label)}" oninput="updLink('${link.id}','label',this.value)">
      <input type="text" placeholder="https://… or paste any URL" value="${escHtml(link.url)}" oninput="updLink('${link.id}','url',this.value)" onblur="fixUrlField(this,'${link.id}')">
    </div>
    <button class="link-del" onclick="delLink('${link.id}')" title="Remove">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>`;
  div.addEventListener('dragstart',e=>{e.dataTransfer.setData('id',link.id);div.classList.add('dragging');});
  div.addEventListener('dragend', ()=>div.classList.remove('dragging'));
  div.addEventListener('dragover',e=>e.preventDefault());
  div.addEventListener('drop',e=>{
    e.preventDefault();
    const fid=e.dataTransfer.getData('id'); if(fid===link.id) return;
    const fi=page.links.findIndex(l=>l.id===fid), ti=page.links.findIndex(l=>l.id===link.id);
    const [m]=page.links.splice(fi,1); page.links.splice(ti,0,m);
    reRenderLinks(); updatePreview(); queueSave();
  });
  list.appendChild(div);
}

function reRenderLinks(){ $('linksList').innerHTML=''; (page.links||[]).forEach(l=>renderLink(l)); }
function updLink(id,field,val){ const l=page.links?.find(l=>l.id===id); if(l){l[field]=val;updatePreview();queueSave();} }
function delLink(id){ page.links=(page.links||[]).filter(l=>l.id!==id); $('linksList').querySelector(`[data-id="${id}"]`)?.remove(); updatePreview();queueSave(); }

function fixUrlField(input,linkId) {
  const raw=input.value.trim(); if(!raw) return;
  if(/^https?:\/\//i.test(raw)||/^(mailto:|tel:)/i.test(raw)) return;
  const fixed='https://'+raw; input.value=fixed; updLink(linkId,'url',fixed);
}

// ICON PICKER
function openIconPicker(linkId,btn) {
  document.querySelectorAll('.icon-popup').forEach(p=>p.remove());
  if(activePicker===btn){ activePicker=null; return; }
  activePicker=btn;
  const cur=page.links?.find(l=>l.id===linkId)?.iconId||'link';
  const popup=document.createElement('div'); popup.className='icon-popup';
  const grid=document.createElement('div'); grid.className='icon-popup-grid';
  ICON_ORDER.forEach(id=>{
    const ic=ICONS[id];
    const opt=document.createElement('div'); opt.className='i-opt'+(id===cur?' sel':'');
    opt.innerHTML=`${svgWith(id,16,ic.color)}<span class="i-opt-lbl">${ic.name}</span>`;
    opt.onclick=()=>{
      const l=page.links?.find(l=>l.id===linkId);
      if(l){ l.iconId=id; btn.style.color=ic.color; btn.innerHTML=svgWith(id,14,ic.color); updatePreview(); queueSave(); }
      popup.remove(); activePicker=null;
    };
    grid.appendChild(opt);
  });
  popup.appendChild(grid);
  btn.closest('.link-icon-wrap').appendChild(popup);
  setTimeout(()=>document.addEventListener('click',function h(e){ if(!popup.contains(e.target)&&e.target!==btn){ popup.remove();activePicker=null;document.removeEventListener('click',h); } }),0);
}

// PREVIEW
function updatePreview() {
  if(!page) return;
  const name=$('fName').value||'Your Name', bio=$('fBio').value||'';
  const pa=$('pvAv');
  if(page.avatarDataUrl) pa.innerHTML=`<img src="${page.avatarDataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
  else pa.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  $('pvName').textContent=name; $('pvBio').textContent=bio;
  const pl=$('pvLinks'); pl.innerHTML='';
  (page.links||[]).forEach(l=>{
    const ic=ICONS[l.iconId]||ICONS.link;
    const a=document.createElement('a'); a.className='pv-link';
    a.href=ensureUrl(l.url); if(l.url&&l.url.trim()) a.target='_blank';
    a.innerHTML=`<span style="display:flex;align-items:center;color:${ic.color}">${svgWith(l.iconId,14,ic.color)}</span><span style="flex:1">${l.label||'Untitled'}</span><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="opacity:.3"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>`;
    pl.appendChild(a);
  });
}

// AUTOSAVE
function queueSave(){ updatePreview(); clearTimeout(saveTimer); setSS('saving'); saveTimer=setTimeout(doSave,1100); }
function setSS(s){ const el=$('saveStatus'); el.className='save-status '+s; el.textContent=s==='saving'?'Saving…':s==='saved'?'Saved':'All saved'; }

async function doSave() {
  if(!page||!currentUser) return;
  const update={name:$('fName').value.trim()||page.name,slug:$('fSlug').value.trim()||page.slug,bio:$('fBio').value,theme:page.theme,avatarEmoji:page.avatarEmoji||'',avatarDataUrl:page.avatarDataUrl||null,links:page.links||[]};
  try { await DB.updatePage(pageId,update); Object.assign(page,update); $('pagePill').textContent=page.name||'Untitled'; setSS('saved'); }
  catch(e){ setSS(''); toast('Save failed','error'); }
}

// PUBLISH
async function publishPage() {
  await doSave();
  const btns=[$('pubBtnTop'),$('pubBtnBottom')];
  btns.forEach(b=>{if(b){b.disabled=true;b.innerHTML=`<div class="spin" style="width:14px;height:14px"></div> Publishing…`;}});
  try {
    const url=`social-tree-self.vercel.app/u/${page.slug}`;
    await DB.updatePage(pageId,{isPublished:true,vercelUrl:url});
    page.isPublished=true; page.vercelUrl=url;
    showLiveUrl(url); toast('Page is live','success');
  } catch(e){ toast('Publish failed','error'); }
  btns.forEach(b=>{if(b){b.disabled=false;b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg> Publish`;}});
}

function showLiveUrl(url){ $('liveRow').classList.remove('hidden'); $('liveLink').href='https://'+url; $('liveLink').textContent=url; }

function downloadHTML() {
  if(!page) return;
  const snap={...page,name:$('fName').value||page.name,bio:$('fBio').value||page.bio};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([generatePageHTML(snap)],{type:'text/html'}));
  a.download=(page.slug||'page')+'-socialtree.html'; a.click(); toast('HTML downloaded');
}

function goBack(){ doSave().then(()=>{ window.location.href='dashboard.html'; }); }
</script>
